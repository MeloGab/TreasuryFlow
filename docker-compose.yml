name: treasuryflow

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: treasuryflow-sqlserver
    hostname: treasuryflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the .env file}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - treasuryflow-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost
          -U sa
          -P "$$MSSQL_SA_PASSWORD"
          -C
          -Q "SELECT 1"
          -b
          -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    container_name: treasuryflow-rabbitmq
    hostname: treasuryflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in the .env file}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in the .env file}"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - treasuryflow-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: treasuryflow-minio
    hostname: treasuryflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the .env file}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the .env file}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - treasuryflow-minio-data:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/TreasuryFlow.Api/Dockerfile
    image: treasuryflow-api:local
    container_name: treasuryflow-api
    hostname: treasuryflow-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__ApplyMigrations: "true"
      ConnectionStrings__TreasuryFlow: >-
        Server=sqlserver,1433;
        Database=TreasuryFlow;
        User Id=sa;
        Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the .env file};
        Encrypt=True;
        TrustServerCertificate=True
      RabbitMq__Enabled: "true"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in the .env file}"
      RabbitMq__Password: "${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in the .env file}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/TreasuryFlow.Worker/Dockerfile
    image: treasuryflow-worker:local
    container_name: treasuryflow-worker
    hostname: treasuryflow-worker
    environment:
      DOTNET_ENVIRONMENT: "Production"
      ConnectionStrings__TreasuryFlow: >-
        Server=sqlserver,1433;
        Database=TreasuryFlow;
        User Id=sa;
        Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the .env file};
        Encrypt=True;
        TrustServerCertificate=True
      RabbitMq__Enabled: "true"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__UserName: "${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in the .env file}"
      RabbitMq__Password: "${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in the .env file}"
      Minio__Endpoint: "minio:9000"
      Minio__UseSsl: "false"
      Minio__AccessKey: "${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the .env file}"
      Minio__SecretKey: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the .env file}"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  treasuryflow-sqlserver-data:
  treasuryflow-rabbitmq-data:
  treasuryflow-minio-data:
