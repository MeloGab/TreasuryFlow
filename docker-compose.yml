name: treasuryflow

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: treasuryflow-sqlserver
    hostname: treasuryflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the .env file}"
    ports:
      - "1433:1433"
    volumes:
      - treasuryflow-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost
          -U sa
          -P "$$MSSQL_SA_PASSWORD"
          -C
          -Q "SELECT 1"
          -b
          -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

volumes:
  treasuryflow-sqlserver-data:
